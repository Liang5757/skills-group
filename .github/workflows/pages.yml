name: Deploy Skill Market

on:
  push:
    branches: [main]
    paths:
      - '.agents/skills/**'
      - 'market/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: market/package-lock.json
      - run: npm ci --prefix market
      - run: npm test --prefix market
      - run: npm run build --prefix market
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: market/dist
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
