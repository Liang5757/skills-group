[metadata]
name = huijin-tracker
version = 0.1.0
description = Evidence-first tracker for public Central Huijin disclosures and holdings snapshots

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    huijin-tracker = huijin_tracker.cli:main
