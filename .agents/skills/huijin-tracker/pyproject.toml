[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huijin-tracker"
version = "0.1.0"
description = "Evidence-first tracker for public Central Huijin disclosures and holdings snapshots"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
huijin-tracker = "huijin_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
